<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-title" content="打卡">
<meta name="theme-color" content="#3B8ED0">
<title>工時打卡</title>
<style>
  html, body { margin: 0; height: 100%; background: #F2EFEC; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
  .fallback {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px;
    font: 14px "Microsoft JhengHei", "PingFang TC", sans-serif; text-align: center;
    background: rgba(42, 32, 48, .9); color: #fff; display: none;
  }
  .fallback a { color: #FFD9A8; }
</style>
</head>
<body>
<iframe id="app" title="工時打卡"
  src="https://script.google.com/macros/s/AKfycbzG4OcLFsr4yUHg3xy_VNKeOHz0UhO82KgGLa4c-EHQzz9aEa1v2aFH7OlzrytRh59XIw/exec"
  allow="clipboard-write"></iframe>
<div class="fallback" id="fb">畫面沒出來？<a href="https://script.google.com/macros/s/AKfycbzG4OcLFsr4yUHg3xy_VNKeOHz0UhO82KgGLa4c-EHQzz9aEa1v2aFH7OlzrytRh59XIw/exec">點這裡直接開啟打卡頁</a></div>
<script>
  // 8 秒內打卡頁沒載入，就顯示備用連結
  var loaded = false;
  document.getElementById('app').addEventListener('load', function () { loaded = true; });
  setTimeout(function () { if (!loaded) document.getElementById('fb').style.display = 'block'; }, 8000);
</script>
</body>
</html>
