<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工時打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 版面：最上面是一張會跟著時間換天色的打卡卡片（清晨、白天、黃昏、夜晚），是整頁唯一的重點；
   下面依序是本週工時和月曆紀錄，都保持安靜。 */
:root{
  --bg:#F2EFEC; --surface:#FFFFFF; --soft:#F6F3F0; --ink:#2A2030; --muted:#756C7A; --line:#E3DDD8;
  --accent:#D9573B; --ok:#1E8E6A; --ok-soft:#E3F3EC; --warn:#B26A00; --warn-soft:#FBEFD9;
  --f-body:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  --f-disp:"Fraunces","Microsoft JhengHei","PingFang TC",serif;
  --f-num:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15121A; --surface:#1F1B26; --soft:#282331; --ink:#EFEAF2; --muted:#A199A8; --line:#352F3F;
    --accent:#F08266; --ok:#4CC49A; --ok-soft:#173529; --warn:#E9B45C; --warn-soft:#3A2C12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15121A; --surface:#1F1B26; --soft:#282331; --ink:#EFEAF2; --muted:#A199A8; --line:#352F3F;
  --accent:#F08266; --ok:#4CC49A; --ok-soft:#173529; --warn:#E9B45C; --warn-soft:#3A2C12; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h2{font-size:15px;margin:0;font-weight:700;letter-spacing:.04em}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto}
.banner{border:1px solid var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.banner[hidden]{display:none}

/* 天色卡片 */
.sky{position:relative;border-radius:24px;overflow:hidden;color:#fff;padding:20px 20px 18px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,var(--s1),var(--s2) 55%,var(--s3));min-height:330px;isolation:isolate;
  --s1:#3B8ED0;--s2:#7DBDE8;--s3:#CDE9F6;--h1:#4F9A8B;--h2:#2F7568;--orb:#FFF6C9;--glow:rgba(255,246,201,.55)}
.sky.dawn{--s1:#7C6FC0;--s2:#EE9AA0;--s3:#FBD3A6;--h1:#B56E86;--h2:#7B4A72;--orb:#FFE3B0;--glow:rgba(255,214,160,.6)}
.sky.dusk{--s1:#6C4B93;--s2:#EE7458;--s3:#FFBE6E;--h1:#C7543F;--h2:#8E3540;--orb:#FFE9A8;--glow:rgba(255,200,120,.65)}
.sky.night{--s1:#0F1533;--s2:#232C5E;--s3:#4A4580;--h1:#262A55;--h2:#161938;--orb:#F4F1E4;--glow:rgba(244,241,228,.35)}
.sky svg{position:absolute;left:0;bottom:0;width:100%;height:46%;z-index:-1}
.sky .h1{fill:var(--h1);opacity:.85}.sky .h2{fill:var(--h2)}
.orb{position:absolute;width:54px;height:54px;border-radius:50%;background:var(--orb);box-shadow:0 0 0 14px var(--glow),0 0 60px 20px var(--glow);z-index:-2;transform:translate(-50%,-50%)}
.sky.night::before{content:"";position:absolute;inset:0;z-index:-3;opacity:.9;
  background:radial-gradient(1.5px 1.5px at 12% 18%,#fff 99%,transparent),radial-gradient(1px 1px at 28% 34%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 46% 12%,#fff 99%,transparent),radial-gradient(1px 1px at 63% 28%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 78% 16%,#fff 99%,transparent),radial-gradient(1px 1px at 90% 38%,#fff 99%,transparent),radial-gradient(1px 1px at 36% 48%,#fff 99%,transparent)}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;text-shadow:0 1px 8px rgba(30,20,40,.35)}
.hello .g{font-size:22px;font-weight:700;letter-spacing:.03em}
.hello .d{font-size:13px;opacity:.95;text-align:right;white-space:nowrap;padding-top:6px}
.clock{font-family:var(--f-disp);font-weight:500;font-size:clamp(54px,18vw,76px);line-height:1;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(30,20,40,.3);display:flex;align-items:baseline;margin-top:6px}
.clock span{display:inline-block;width:.6em;text-align:center}
.clock span.c{width:.3em}
.clock .sec{font-size:.42em;opacity:.9;margin-left:.25em;display:flex}
.say{font-size:15px;min-height:1.5em;text-shadow:0 1px 8px rgba(30,20,40,.4)}
.say b{font-family:var(--f-num);font-weight:600}
.spacer{flex:1 1 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.22);border-radius:999px;padding:3px;gap:3px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;color:#fff;font:inherit;font-size:14px;padding:7px 8px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.92);color:#2A2030;font-weight:700}
.punch{font:inherit;font-size:21px;font-weight:700;letter-spacing:.18em;border:0;border-radius:16px;padding:18px;cursor:pointer;
  background:rgba(255,255,255,.94);color:#2A2030;box-shadow:0 8px 24px rgba(30,20,40,.25);min-height:62px}
.punch.out{background:#2A2030;color:#fff}
.punch:disabled{opacity:.55;cursor:not-allowed}
.punch:active:not(:disabled){transform:translateY(1px)}
@media (prefers-reduced-motion:no-preference){
  .say.pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.92);opacity:.3}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
  .orb{transition:left 1s ease,top 1s ease}
}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 本週 */
.wk{display:flex;align-items:baseline;gap:8px}
.wk .n{font-family:var(--f-disp);font-size:40px;font-weight:600;line-height:1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:96px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.day .v{font-size:11px;color:var(--muted)}
.day .col{width:100%;max-width:32px;background:var(--soft);border-radius:8px;min-height:4px}
.day.has .col{background:var(--ok)}
.day.live .col{background:var(--accent)}
.day .l{font-size:12px;color:var(--muted)}
.day.today .l{color:var(--ink);font-weight:700}

/* 月曆 */
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav .m{font-size:17px;font-weight:700;text-align:center}
.monthnav .m small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0}
.cell{border:1px solid transparent;background:none;border-radius:10px;padding:5px 2px 6px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:inherit;cursor:pointer;min-width:0}
.cell:disabled{cursor:default;opacity:.38}
.cell .dn{font-size:13px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
.cell.we .dn{color:var(--muted)}
.cell.today .dn{background:var(--ink);color:var(--surface);font-weight:700}
.cell .tm{font-family:var(--f-num);font-size:10.5px;line-height:1.25;letter-spacing:-.02em}
.cell.done{background:var(--ok-soft)}.cell.done .tm{color:var(--ok)}
.cell.fix{background:var(--warn-soft)}.cell.fix .tm{color:var(--warn)}
.cell.live{border-color:var(--accent)}.cell.live .tm{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.stampmark{border:2px solid var(--accent);color:var(--accent);border-radius:8px;padding:3px 10px;font-weight:700;transform:rotate(-4deg);letter-spacing:.15em;font-size:14px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay .k{font-size:12px;color:var(--muted)}.pay .v{font-size:22px;font-weight:600}
[hidden]{display:none!important}

/* 底部面板 */
.scrim{position:fixed;inset:0;background:rgba(20,12,28,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;border:1px solid var(--line)}
.sheet h3{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:inherit;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.err{color:var(--accent);font-size:14px;min-height:1.2em}
.rec{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.rec .t{font-size:17px}.rec .note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="sky" id="sky" aria-label="打卡">
    <div class="orb" id="orb" aria-hidden="true"></div>
    <svg viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
      <path class="h1" d="M0,120 C60,80 110,105 170,90 C230,75 280,110 330,88 C360,75 385,85 400,80 L400,200 L0,200Z"/>
      <path class="h2" d="M0,160 C50,130 100,152 160,140 C220,128 260,165 320,146 C360,134 380,146 400,140 L400,200 L0,200Z"/>
    </svg>
    <div class="hello"><div class="g" id="greet">你好</div><div class="d" id="today"></div></div>
    <div class="clock" id="clock" aria-live="off"></div>
    <div class="say" id="say">讀取中</div>
    <div class="spacer"></div>
    <div class="seg" id="modeSeg" role="group" aria-label="工作地點">
      <button type="button" data-mode="wfh" aria-pressed="true">在家工作</button>
      <button type="button" data-mode="office" aria-pressed="false">進公司</button>
    </div>
    <button type="button" class="punch" id="punchBtn" disabled>上班打卡</button>
  </section>

  <div class="banner" id="banner" hidden></div>

  <section class="card" id="signCard" hidden></section>

  <section class="card" aria-label="本週工時">
    <div class="row between"><h2>本週工時</h2><span class="sub" id="weekRange"></span></div>
    <div class="wk"><span class="n" id="weekHours">0</span><span class="sub" id="weekUnit">小時</span></div>
    <div class="days" id="days"></div>
  </section>

  <section class="card" aria-label="打卡紀錄">
    <div class="monthnav">
      <button type="button" class="btn small" id="prevM" aria-label="上個月">‹</button>
      <div class="m"><span id="monthLabel"></span><small id="monthSum"></small></div>
      <button type="button" class="btn small" id="nextM" aria-label="下個月">›</button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="row between">
      <div class="legend"><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>正常</span><span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>補登</span></div>
      <button type="button" class="btn small" id="addBtn">忘刷補登</button>
    </div>
    <div class="sub">點日期可以看當天的打卡時間。</div>
  </section>

  <section class="card" id="ownerCard" hidden aria-label="月結">
    <div class="row between"><h2>月結</h2><span class="chip">只有管理者看得到</span></div>
    <div class="pay">
      <div><div class="k" id="oMonth">工時</div><div class="v num" id="mHours">0:00</div></div>
      <div><div class="k" id="oRate">應付金額</div><div class="v num" id="mPay">NT$0</div></div>
    </div>
    <div class="sub" id="payLine"></div>
    <div class="row" id="payActions"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script>
(function(){
"use strict";
var TZ="Asia/Taipei";
var fD=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
var fT=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
var fTS=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
var WD=["日","一","二","三","四","五","六"];
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dstr(d){return fD.format(d)}
function tstr(iso){return fT.format(new Date(iso))}
function parts(ds){var a=ds.split("-");return [+a[0],+a[1],+a[2]]}
function utc(ds){var p=parts(ds);return Date.UTC(p[0],p[1]-1,p[2])}
function wd(ds){return new Date(utc(ds)).getUTCDay()}
function addDays(ds,n){return new Date(utc(ds)+n*86400000).toISOString().slice(0,10)}
function weekStart(ds){return addDays(ds,-((wd(ds)+6)%7))}
function md(ds){var p=parts(ds);return p[1]+"/"+p[2]}
function hm(min){min=Math.max(0,Math.round(min));return Math.floor(min/60)+":"+String(min%60).padStart(2,"0")}
function hmText(min){min=Math.max(0,Math.round(min));var h=Math.floor(min/60),m=min%60;return (h?h+" 小時":"")+(m||!h?(h?" ":"")+m+" 分":"")}
function money(n){return "NT$"+Math.round(n).toLocaleString("en-US")}
function monthOf(ds){return ds.slice(0,7)}
function addMonth(ym,n){var a=ym.split("-");return new Date(Date.UTC(+a[0],+a[1]-1+n,1)).toISOString().slice(0,7)}
function monthLabel(ym){var a=ym.split("-");return a[0]+" 年 "+(+a[1])+" 月"}
function toISO(ds,hhmm){return new Date(ds+"T"+hhmm+":00+08:00").toISOString()}

var S={punches:[],cfg:{name:"",rate:400,payDay:5},receipts:{},db:null,user:null,
  me:{id:null,owner:false,canWrite:null},loaded:false,mode:"wfh",viewMonth:monthOf(dstr(new Date())),busy:false,names:{},pop:false};

function minutesOf(p,now){
  if(!p.inAt) return 0;
  var end=p.outAt?new Date(p.outAt).getTime():(now||0);
  if(!end) return 0;
  return Math.max(0,Math.round((end-new Date(p.inAt).getTime())/60000));
}
function openShift(){
  var o=S.punches.filter(function(p){return p.inAt&&!p.outAt});
  o.sort(function(a,b){return a.inAt<b.inAt?1:-1});
  return o[0]||null;
}
function canWrite(){return S.loaded&&S.me.canWrite!==false}
function dayRecs(ds){return S.punches.filter(function(p){return p.date===ds}).sort(function(a,b){return a.inAt<b.inAt?-1:1})}

/* ---------- 天色卡片 ---------- */
function renderSky(){
  var now=new Date(),t=fTS.format(now).split(":"),h=+t[0]+(+t[1])/60,ds=dstr(now),p=parts(ds);
  var phase=h>=5&&h<8?"dawn":h>=8&&h<16?"day":h>=16&&h<19?"dusk":"night";
  $("sky").className="sky "+(phase==="day"?"":phase);
  var f=phase==="night"?(((h+24-19)%24)/10):((h-5)/14);
  f=Math.min(1,Math.max(0,f));
  $("orb").style.left=(10+f*80)+"%";$("orb").style.top=(58-Math.sin(Math.PI*f)*42)+"%";
  var g=h>=5&&h<11?"早安":h>=11&&h<14?"午安":h>=14&&h<18?"下午好":h>=18&&h<23?"晚上好":"夜深了";
  $("greet").textContent=(S.cfg.name?S.cfg.name+"，":"")+g;
  $("today").textContent=p[1]+" 月 "+p[2]+" 日　週"+WD[wd(ds)];
}
function renderPunch(){
  var o=openShift(),b=$("punchBtn"),say=$("say");
  if(!S.loaded){say.textContent="讀取中";b.disabled=true;return}
  b.disabled=!canWrite()||S.busy;
  var t=dstr(new Date()),done=dayRecs(t).filter(function(p){return p.outAt});
  var m=done.reduce(function(a,p){return a+minutesOf(p)},0);
  if(o){
    var wfh=o.mode!=="office";
    b.textContent=wfh?"結束這段工作":"下班打卡";b.className="punch out";
    say.innerHTML="<b>"+tstr(o.inAt)+"</b> "+(wfh?"開始":"上班")+"，已經 <b id=\"elapsed\">"+hm(minutesOf(o,Date.now()))+"</b>"+(done.length?"（今天第 "+(done.length+1)+" 段）":"");
    $("modeSeg").hidden=true;
  }else{
    b.textContent=S.mode==="office"?"上班打卡":(done.length?"再開始一段":"開始工作");b.className="punch";
    say.textContent=done.length?"今天共 "+hmText(m)+(done.length>1?"（"+done.length+" 段）":""):"今天還沒打卡";
    $("modeSeg").hidden=false;
  }
  if(S.me.canWrite===false) say.textContent="你目前只能看，還不能打卡";
  if(S.pop){S.pop=false;say.classList.remove("pop");void say.offsetWidth;say.classList.add("pop")}
}
function renderWeek(){
  var now=Date.now(),t=dstr(new Date()),ws=weekStart(t),tot=0,per=[0,0,0,0,0,0,0],live=-1,i;
  S.punches.forEach(function(p){
    if(!p.date) return; var k=Math.round((utc(p.date)-utc(ws))/86400000);
    if(k<0||k>6) return; var m=minutesOf(p,now); per[k]+=m; tot+=m; if(!p.outAt) live=k;
  });
  var h=Math.floor(tot/60),m=tot%60;
  $("weekHours").textContent=h;$("weekUnit").textContent="小時"+(m?" "+m+" 分":"");
  var mx=Math.max.apply(null,per.concat([480])),html="";
  for(i=0;i<7;i++){
    var ds=addDays(ws,i),v=per[i];
    html+="<div class=\"day"+(v?" has":"")+(i===live?" live":"")+(ds===t?" today":"")+"\"><span class=\"v num\">"+(v?(v/60).toFixed(1):"")+"</span><span class=\"col\" style=\"height:"+Math.max(4,Math.round(v/mx*58))+"px\"></span><span class=\"l\">"+WD[(i+1)%7]+"</span></div>";
  }
  $("days").innerHTML=html;
  $("weekRange").textContent=md(ws)+" – "+md(addDays(ws,6));
}
function monthRecs(){return S.punches.filter(function(p){return p.date&&monthOf(p.date)===S.viewMonth})}
function monthTotal(){return monthRecs().reduce(function(a,p){return a+(p.outAt?minutesOf(p):0)},0)}
function payDate(ym){var n=addMonth(ym,1).split("-");return n[0]+"/"+(+n[1])+"/"+S.cfg.payDay}
function renderCal(){
  var ym=S.viewMonth,t=dstr(new Date()),first=ym+"-01",lead=wd(first),a=ym.split("-");
  var n=new Date(Date.UTC(+a[0],+a[1],0)).getUTCDate(),html="",i;
  $("monthLabel").textContent=monthLabel(ym);
  var days={};monthRecs().forEach(function(p){days[p.date]=1});
  var cnt=Object.keys(days).length;
  $("monthSum").textContent=cnt?"出勤 "+cnt+" 天，共 "+hmText(monthTotal()):"還沒有紀錄";
  $("nextM").disabled=ym>=monthOf(t);
  for(i=0;i<7;i++) html+="<div class=\"hd\">"+WD[i]+"</div>";
  for(i=0;i<lead;i++) html+="<div></div>";
  for(i=1;i<=n;i++){
    var ds=ym+"-"+String(i).padStart(2,"0"),rs=dayRecs(ds),w=wd(ds),cls="cell",tm="";
    if(w===0||w===6) cls+=" we";
    if(ds===t) cls+=" today";
    if(rs.length){
      var open=rs.some(function(p){return !p.outAt}),fix=rs.some(function(p){return p.manual||p.editedAt});
      cls+=open?" live":fix?" fix":" done";
      var last=rs[rs.length-1],dm=rs.reduce(function(a,p){return a+(p.outAt?minutesOf(p):0)},0);
      if(rs.length>1) tm="<span class=\"tm\">"+rs.length+" 段</span><span class=\"tm\">"+(open?"工作中":hm(dm))+"</span>";
      else tm="<span class=\"tm\">"+tstr(rs[0].inAt)+"</span><span class=\"tm\">"+(open?"工作中":tstr(last.outAt))+"</span>";
    }
    html+="<button type=\"button\" class=\""+cls+"\" data-d=\""+ds+"\""+(ds>t?" disabled":"")+" aria-label=\""+md(ds)+(rs.length?" 有打卡紀錄":"")+"\"><span class=\"dn\">"+i+"</span>"+tm+"</button>";
  }
  $("cal").innerHTML=html;
  $("addBtn").disabled=!canWrite();
}
function renderPay(){
  var ym=S.viewMonth,tot=monthTotal(),amt=Math.round(tot*S.cfg.rate/60),r=S.receipts[ym]||{};
  /* 管理者 */
  $("ownerCard").hidden=!S.me.owner;
  if(S.me.owner){
    $("oMonth").textContent=monthLabel(ym)+" 工時";$("oRate").textContent="應付金額（時薪 "+money(S.cfg.rate)+"）";
    $("mHours").textContent=hm(tot);$("mPay").textContent=money(amt);
    var line="發放日 "+payDate(ym)+"（現金）",act="";
    if(r.signedAt){line="已於 "+md(r.signedAt.slice(0,10))+" 簽收 "+money(r.amount);act="<span class=\"stampmark\">已簽收</span>";
      if(r.amount!==amt) line+="。之後紀錄有變動，目前算出來是 "+money(amt)}
    else if(r.paidAt){line="已於 "+md(r.paidAt.slice(0,10))+" 發放 "+money(r.amount)+"，等待簽收";act="<button type=\"button\" class=\"btn small\" data-act=\"unpaid\">取消發放標記</button>"}
    else if(tot>0) act="<button type=\"button\" class=\"btn\" data-act=\"paid\">標記已發放現金</button>";
    if(tot>0) act+="<button type=\"button\" class=\"btn small\" data-act=\"copy\">複製簽收單文字</button>";
    $("payLine").textContent=line;$("payActions").innerHTML=act;
  }
  /* 本人：只有在已發放、還沒簽收時才出現 */
  var sc=$("signCard"),pend=null;
  if(!S.me.owner&&S.loaded) Object.keys(S.receipts).sort().forEach(function(k){var x=S.receipts[k];if(x&&x.paidAt&&!x.signedAt&&!pend)pend={ym:k,r:x}});
  if(pend&&canWrite()){
    sc.hidden=false;
    sc.innerHTML="<h2>"+monthLabel(pend.ym)+" 薪資簽收</h2><div>"+hmText(pend.r.minutes)+"，現金 <b class=\"num\">"+money(pend.r.amount)+"</b></div>"+
      "<button type=\"button\" class=\"btn primary\" data-sign=\""+pend.ym+"\">我已領到現金，簽收</button>";
  }else{sc.hidden=true;sc.innerHTML=""}
}
function renderAll(){renderSky();renderPunch();renderWeek();renderCal();renderPay()}
function banner(msg){var b=$("banner");if(msg){b.textContent=msg;b.hidden=false}else{b.hidden=true}}

/* ---------- 面板 ---------- */
var lastFocus=null;
function openSheet(html){lastFocus=document.activeElement;$("sheet").innerHTML=html;$("scrim").hidden=false;var f=$("sheet").querySelector("input,button,select,textarea");if(f)f.focus()}
function closeSheet(){$("scrim").hidden=true;$("sheet").innerHTML="";if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$("scrim").addEventListener("click",function(e){if(e.target===$("scrim"))closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("scrim").hidden)closeSheet()});

function sheetOut(o){
  var wfh=o.mode!=="office",mins=minutesOf(o,Date.now());
  openSheet("<h3 id=\"sheetTitle\">"+(wfh?"結束這段工作":"下班打卡")+"</h3>"+
    "<div class=\"sub\">"+tstr(o.inAt)+" 到現在 "+tstr(new Date().toISOString())+"，共 <b class=\"num\">"+hm(mins)+"</b>"+(wfh?"":"（午休照算）")+"</div>"+
    "<div class=\"field\"><label for=\"outNote\">"+(wfh?"這段做了什麼":"備註（可不填）")+"</label><input id=\"outNote\" maxlength=\"100\" placeholder=\""+(wfh?"例如：104 篩履歷、約面試":"例如：今天做了什麼")+"\"></div>"+
    "<div class=\"err\" id=\"sErr\"></div>"+
    "<div class=\"row\"><button type=\"button\" class=\"btn grow\" id=\"sCancel\">取消</button><button type=\"button\" class=\"btn dark grow\" id=\"sOk\">確認</button></div>");
  $("sCancel").onclick=closeSheet;
  $("sOk").onclick=function(){
    $("sOk").disabled=true;$("sOk").textContent="儲存中…";
    call("punchOut",[o.id,0,$("outNote").value.trim(),KEY])
      .then(function(d){S.pop=true;closeSheet();apply(d)}).catch(function(e){$("sOk").disabled=false;$("sOk").textContent="確認";$("sErr").textContent=writeErr(e)});
  };
}
function sheetDay(ds){
  var rs=dayRecs(ds),html="<h3 id=\"sheetTitle\">"+md(ds)+"　週"+WD[wd(ds)]+"</h3>";
  if(!rs.length) html+="<div class=\"sub\">這天沒有打卡紀錄。</div>";
  else html+="<div class=\"sub\">共 "+rs.length+" 段，"+hmText(rs.reduce(function(a,p){return a+(p.outAt?minutesOf(p):0)},0))+"</div>";
  rs.forEach(function(p){
    var chips="<span class=\"chip\">"+(p.mode==="wfh"?"在家":"進公司")+"</span>";
    if(p.manual) chips+=" <span class=\"chip warn\">忘刷補登</span>"; else if(p.editedAt) chips+=" <span class=\"chip warn\">已修改</span>";
    html+="<div class=\"rec\"><div><div class=\"t num\">"+tstr(p.inAt)+" → "+(p.outAt?tstr(p.outAt):"上班中")+(p.outAt?"　<b>"+hm(minutesOf(p))+"</b>":"")+"</div><div style=\"margin-top:4px\">"+chips+"</div>"+
      (p.note?"<div class=\"note\">"+esc(p.note)+"</div>":"")+"</div>"+(canWrite()?"<button type=\"button\" class=\"btn small\" data-edit=\""+esc(p.id)+"\">修改</button>":"")+"</div>";
  });
  html+="<div class=\"row\"><button type=\"button\" class=\"btn grow\" id=\"sCancel\">關閉</button>"+(canWrite()?"<button type=\"button\" class=\"btn primary grow\" id=\"sAdd\">補登一段</button>":"")+"</div>";
  openSheet(html);
  $("sCancel").onclick=closeSheet;
  if($("sAdd")) $("sAdd").onclick=function(){sheetEdit(null,ds)};
  $("sheet").querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){var p=S.punches.filter(function(x){return x.id===b.dataset.edit})[0];if(p)sheetEdit(p)}});
}
function sheetEdit(p,date){
  var isNew=!p,t=dstr(new Date()),d0=date||t;
  p=p||{date:d0,inAt:toISO(d0,"09:00"),outAt:toISO(d0,"11:00"),breakMin:0,mode:"wfh",note:""};
  var who="";
  openSheet("<h3 id=\"sheetTitle\">"+(isNew?"忘刷補登":"修改紀錄")+"</h3>"+
    (isNew?"<div class=\"sub\">忘記打卡時在這裡補上，紀錄會標示為補登。</div>":(who?"<div class=\"sub\">"+esc(who)+"</div>":""))+
    "<div class=\"field\"><label for=\"eDate\">日期</label><input type=\"date\" id=\"eDate\" value=\""+esc(p.date)+"\" max=\""+t+"\"></div>"+
    "<div class=\"two\"><div class=\"field\"><label for=\"eIn\">上班</label><input type=\"time\" id=\"eIn\" value=\""+tstr(p.inAt)+"\"></div>"+
    "<div class=\"field\"><label for=\"eOut\">下班</label><input type=\"time\" id=\"eOut\" value=\""+(p.outAt?tstr(p.outAt):"")+"\"></div></div>"+
    "<div class=\"field\"><label for=\"eMode\">地點</label><select id=\"eMode\"><option value=\"wfh\""+(p.mode!=="office"?" selected":"")+">在家工作</option><option value=\"office\""+(p.mode==="office"?" selected":"")+">進公司</option></select></div>"+
    "<div class=\"field\"><label for=\"eNote\">"+(isNew?"忘刷原因":"備註")+"</label><input id=\"eNote\" maxlength=\"100\" value=\""+esc(p.note||"")+"\""+(isNew?" placeholder=\"例如：忘記按、手機沒電\"":"")+"></div>"+
    "<div class=\"err\" id=\"sErr\"></div>"+
    "<div class=\"row\"><button type=\"button\" class=\"btn grow\" id=\"sCancel\">取消</button><button type=\"button\" class=\"btn primary grow\" id=\"sOk\">儲存</button></div>"+
    (isNew?"":"<button type=\"button\" class=\"btn danger small\" id=\"sDel\">刪除這筆紀錄</button>"));
  $("sCancel").onclick=closeSheet;
  $("sOk").onclick=function(){
    var d=$("eDate").value,i=$("eIn").value,o=$("eOut").value,b=0,E=$("sErr");
    if(!d||!i){E.textContent="請填日期和上班時間。";return}
    if(d>t){E.textContent="不能補登未來的日期。";return}
    var inAt=toISO(d,i),outAt=o?toISO(d,o):null;
    if(outAt&&outAt<=inAt){E.textContent="下班時間要晚於上班時間。";return}
    if(!outAt&&d!==t){E.textContent="過去的日期請填下班時間。";return}
    var body={date:d,inTime:i,outTime:o||"",breakMin:b,mode:$("eMode").value,note:$("eNote").value.trim()};
    $("sOk").disabled=true;$("sOk").textContent="儲存中…";
    call("savePunch",[isNew?null:p.id,body,KEY]).then(function(r){S.viewMonth=monthOf(d);closeSheet();apply(r)}).catch(function(e){$("sOk").disabled=false;$("sOk").textContent="儲存";E.textContent=writeErr(e)});
  };
  if(!isNew){var armed=false;$("sDel").onclick=function(){
    if(!armed){armed=true;$("sDel").textContent="再按一次確定刪除";return}
    $("sDel").disabled=true;
    call("deletePunch",[p.id,KEY]).then(function(d){closeSheet();apply(d)}).catch(function(e){$("sDel").disabled=false;$("sErr").textContent=writeErr(e)});
  }}
}
function errText(e){var m=e&&(e.message||String(e));return m?m.replace(/^Exception:\s*/,""):"請檢查網路後再試一次。"}
function writeErr(e){return "沒有存成功："+errText(e)}
function receiptText(){
  var recs=monthRecs().filter(function(p){return p.outAt}).sort(function(a,b){return a.inAt<b.inAt?-1:1}),tot=monthTotal(),amt=Math.round(tot*S.cfg.rate/60);
  var L=["薪資簽收單","期間："+monthLabel(S.viewMonth),"姓名："+(S.cfg.name||"＿＿＿＿"),
    "工時："+hmText(tot)+"（時薪 "+money(S.cfg.rate)+"）","金額："+money(amt)+"（現金）","","明細："];
  recs.forEach(function(p){L.push(md(p.date)+"（"+WD[wd(p.date)]+"）"+tstr(p.inAt)+"–"+tstr(p.outAt)+"　"+hm(minutesOf(p))+"　"+(p.mode==="wfh"?"在家":"進公司"))});
  L.push("","本人確認已於　　年　　月　　日領取上述款項。","","簽收人：＿＿＿＿＿＿　　發放人：＿＿＿＿＿＿");
  return L.join("\n");
}

/* ---------- 操作 ---------- */
$("modeSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;S.mode=b.dataset.mode;
  $("modeSeg").querySelectorAll("button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});renderPunch()});
$("punchBtn").addEventListener("click",function(){
  if(!canWrite()||S.busy) return;
  var o=openShift();
  if(o){sheetOut(o);return}
  S.busy=true;renderPunch();
  $("punchBtn").textContent="打卡中…";
  call("punchIn",[S.mode,KEY])
    .then(function(d){S.busy=false;S.pop=true;apply(d)})
    .catch(function(e){S.busy=false;banner(writeErr(e));renderPunch()});
});
$("prevM").onclick=function(){S.viewMonth=addMonth(S.viewMonth,-1);renderCal();renderPay()};
$("nextM").onclick=function(){S.viewMonth=addMonth(S.viewMonth,1);renderCal();renderPay()};
$("addBtn").onclick=function(){if(canWrite())sheetEdit(null)};
$("cal").addEventListener("click",function(e){var b=e.target.closest(".cell");if(!b||b.disabled)return;sheetDay(b.dataset.d)});
$("signCard").addEventListener("click",function(e){
  var b=e.target.closest("[data-sign]");if(!b||!canWrite())return;b.disabled=true;
  call("signReceipt",[b.dataset.sign,KEY]).then(apply).catch(function(er){b.disabled=false;banner(writeErr(er))});
});
$("payActions").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var a=b.dataset.act,ym=S.viewMonth,tot=monthTotal(),amt=Math.round(tot*S.cfg.rate/60),now=new Date().toISOString();
  if(a==="copy"){
    var txt=receiptText();
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject())
      .then(function(){b.textContent="已複製，可貼到 Word 或 LINE"})
      .catch(function(){openSheet("<h3 id=\"sheetTitle\">簽收單文字</h3><div class=\"field\"><label for=\"rTxt\">長按全選後複製</label><textarea id=\"rTxt\" rows=\"12\" readonly></textarea></div><button type=\"button\" class=\"btn\" id=\"sCancel\">關閉</button>");$("rTxt").value=txt;$("sCancel").onclick=closeSheet});
    return;
  }
  if(!canWrite()) return;
  b.disabled=true;
  var w=a==="paid"?call("markPaid",[ym,KEY]):a==="unpaid"?call("unmarkPaid",[ym,KEY]):null;
  if(w) w.then(apply).catch(function(er){b.disabled=false;banner(writeErr(er))});
});

/* ---------- 時鐘 ---------- */
var tick=0;
function clockTick(){
  var now=new Date(),t=fTS.format(now),h="";
  for(var i=0;i<5;i++) h+="<span"+(t[i]===":"?" class=\"c\"":"")+">"+t[i]+"</span>";
  $("clock").innerHTML=h+"<span class=\"sec\"><span>"+t[6]+"</span><span>"+t[7]+"</span></span>";
  var o=openShift(),el=$("elapsed");
  if(o&&el) el.textContent=hm(minutesOf(o,now.getTime()));
  if(++tick%30===0){renderSky();if(o)renderWeek()}
}
clockTick();setInterval(clockTick,1000);
renderAll();

/* ---------- 資料（Google 試算表） ---------- */
var KEY="";
function call(fn,args){return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);r[fn].apply(r,args)})}
function apply(d){
  S.punches=d.punches||[];S.receipts=d.receipts||{};S.me.owner=!!d.admin;S.me.canWrite=true;
  S.cfg={name:d.cfg.name||"",rate:d.cfg.rate||0,payDay:d.cfg.payDay||5};
  S.loaded=true;banner("");renderAll();
}
function load(quiet){
  return call("getData",[KEY]).then(apply).catch(function(e){if(!quiet)banner("讀取失敗："+errText(e));S.loaded=true;renderAll()});
}
function start(){
  if(!window.google||!google.script){banner("請用部署後的網址開啟這個頁面。");return}
  google.script.url.getLocation(function(loc){KEY=(loc&&loc.parameter&&loc.parameter.k)||"";load()});
  setInterval(function(){if(document.visibilityState==="visible"&&$("scrim").hidden&&!S.busy)load(true)},60000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")load(true)});
}
start();
})();
</script>
